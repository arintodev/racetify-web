# VPS A: public site and organizer app behind the existing Nginx + Cloudflare Tunnel.
# This is a separate Compose project from racetify-api; both join racetify-api_edge.
name: racetify-web

x-logging: &logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

x-next-service: &next-service
  restart: unless-stopped
  init: true
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  stop_grace_period: 30s
  networks:
    - edge
  logging: *logging
  healthcheck:
    test:
      [
        "CMD",
        "node",
        "-e",
        "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
      ]
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 30s

services:
  web:
    <<: *next-service
    image: ${IMAGE_PREFIX:-ghcr.io/ORG}/racetify-web:${TAG:?set TAG in the deploy script}
    env_file: .env.web
    tmpfs:
      - /tmp:size=64m
      # ISR (sitemap revalidate=3600) writes here at runtime.
      - /app/apps/web/.next/cache:size=256m

  app:
    <<: *next-service
    image: ${IMAGE_PREFIX:-ghcr.io/ORG}/racetify-app:${TAG:?set TAG in the deploy script}
    env_file: .env.app
    tmpfs:
      - /tmp:size=64m
      - /app/apps/app/.next/cache:size=256m

networks:
  edge:
    external: true
    name: racetify-api_edge
