        status:
          type: string
        url:
          type: string
    WebhookSecretDto:
      type: object
      required:
      - secret
      - rotatedAt
      properties:
        rotatedAt:
          type: string
          format: date-time
        secret:
          type: string
    WorkspaceEventDto:
      type: object
      required:
      - id
      - name
      - slug
      - orgId
      - startDate
      - endDate
      - status
      - accessSource
      properties:
        accessSource:
          type: string
        endDate:
          type: string
        id:
          type: string
          format: uuid
        name:
          type: string
        orgId:
          type: string
          format: uuid
        role:
          oneOf:
          - $ref: '#/components/schemas/WorkspaceRoleDto'
          - type: 'null'
        slug:
          type: string
        startDate:
          type: string
        status:
          type: string
    WorkspaceOrgDto:
      type: object
      required:
      - id
      - name
      - slug
      - status
      - role
      - eventCount
      properties:
        eventCount:
          type: integer
          format: int32
          minimum: 0
        id:
          type: string
          format: uuid
        logoUrl:
          type:
          - string
          - 'null'
        name:
          type: string
        role:
          $ref: '#/components/schemas/WorkspaceRoleDto'
        slug:
          type: string
        status:
          type: string
    WorkspaceRoleDto:
      type: object
      required:
      - id
      - name
      - slug
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
    WorkspacesDto:
      type: object
      required:
      - organizations
      - events
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/WorkspaceEventDto'
        organizations:
          type: array
          items:
            $ref: '#/components/schemas/WorkspaceOrgDto'
