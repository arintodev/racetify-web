openapi: 3.1.0
info:
  title: Racetify API
  description: Multi-tenant race-event management API. Authenticated organizer, platform admin, and anonymous public surfaces share one binary.
  license:
    name: proprietary
    identifier: proprietary
  version: 0.1.0
paths:
  /.well-known/oauth-authorization-server:
    get:
      tags:
      - oauth
      summary: Authorization-server metadata. Mounted outside `/v1`.
      operationId: metadata
      responses:
        '200':
          description: Authorization server metadata
  /healthz:
    get:
      tags:
      - system
      summary: Liveness probe
      operationId: healthz
      responses:
        '200':
          description: The process is running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /readyz:
    get:
      tags:
      - system
      summary: Readiness probe
      operationId: readyz
      responses:
        '200':
          description: PostgreSQL and Redis are reachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
        '503':
          description: One or more dependencies are unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
  /v1/admin/audit-logs:
    get:
      tags:
      - admin
      operationId: list_audit_logs
      responses:
        '200':
          description: Global audit log
  /v1/admin/audit-logs/{logId}:
    get:
      tags:
      - admin
      operationId: get_audit_log
      parameters:
      - name: logId
        in: path
        description: Audit log ID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Audit log detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAuditDetailDto'
  /v1/admin/face-enrollments:
    get:
      tags:
      - admin
      operationId: list_face_enrollments
      responses:
        '200':
          description: Face enrollment table
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FaceEnrollmentRowDto'
  /v1/admin/face-enrollments/{enrollmentId}:
    get:
      tags:
      - admin
      operationId: get_face_enrollment
      parameters:
      - name: enrollmentId
        in: path
        description: Face enrollment ID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Face enrollment detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FaceEnrollmentDetailDto'
        '404':
          description: Enrollment not found
  /v1/admin/face-enrollments/{enrollmentId}/images/{imageId}:
    get:
      tags:
      - admin
      operationId: face_enrollment_image_preview
      parameters:
      - name: enrollmentId
        in: path
        description: Face enrollment ID
        required: true
        schema:
          type: string
          format: uuid
      - name: imageId
        in: path
        description: Enrollment image ID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Short-lived image preview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FaceEnrollmentImagePreviewDto'
        '404':
          description: Enrollment or image not found
  /v1/admin/jobs:
    get:
      tags:
      - admin
      operationId: list_jobs
      responses:
        '200':
          description: Job table
  /v1/admin/jobs/{jobId}:
    get:
      tags:
      - admin
      operationId: get_job
      parameters:
      - name: jobId
        in: path
        description: Job ID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Job detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminJobDetailDto'
  /v1/admin/jobs/{jobId}/retry:
    post:
      tags:
      - admin
      operationId: retry_job
      parameters:
      - name: jobId
        in: path
        description: Job ID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Job re-queued
        '409':
          description: Job is not retryable
  /v1/admin/orgs:
    get:
      tags:
      - admin
      operationId: list_organizations
      responses:
        '200':
          description: Organization table
    post:
      tags:
      - admin
      operationId: create_organization
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrganizationRequest'
        required: true
      responses:
        '201':
          description: Created organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateOrganizationResponseDto'
        '409':
          description: Slug taken or owner inactive
        '422':
          description: Validation failed
  /v1/admin/orgs/{orgId}:
    get:
      tags:
      - admin
      operationId: get_organization
      parameters:
      - name: orgId
        in: path
        description: Organization ID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Organization detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminOrganizationRowDto'
    delete:
      tags:
      - admin
      operationId: delete_organization
      parameters:
      - name: orgId
        in: path
        description: Organization ID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Organization deleted
        '404':
          description: Organization not found
  /v1/admin/orgs/{orgId}/activate:
    post:
      tags:
      - admin
      operationId: activate_organization
      parameters:
      - name: orgId
        in: path
        description: Organization ID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Activated organization
  /v1/admin/orgs/{orgId}/owner:
    post:
      tags:
      - admin
      operationId: assign_organization_owner
      parameters:
      - name: orgId
        in: path
        description: Organization ID
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignOrganizationOwnerRequest'
        required: true
      responses:
        '200':
          description: Owner assigned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminOrganizationRowDto'
        '404':
          description: Organization or account not found
        '409':
          description: Owner account is not active
        '422':
          description: Validation failed
  /v1/admin/orgs/{orgId}/suspend:
    post:
      tags:
      - admin
      operationId: suspend_organization
      parameters:
      - name: orgId
        in: path
        description: Organization ID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Suspended organization
  /v1/admin/overview:
    get:
      tags:
      - admin
      operationId: overview
      responses:
        '200':
          description: Platform overview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformOverviewDto'
  /v1/admin/overviews/{orgId}:
    get:
      tags:
      - admin
      operationId: tenant_snapshot
      parameters:
      - name: orgId
        in: path
        description: Organization ID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Tenant snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantSnapshotDto'
  /v1/admin/permissions:
    get:
      tags:
      - admin
      operationId: list_permissions
      responses:
        '200':
          description: Permission catalog
  /v1/admin/roles:
    get:
      tags:
      - admin
      operationId: list_roles
      responses:
        '200':
          description: System roles
    post:
      tags:
      - admin
      operationId: create_role
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSystemRoleRequest'
        required: true
      responses:
        '201':
          description: Created system role
  /v1/admin/roles/{roleId}:
    delete:
      tags:
      - admin
      operationId: delete_role
      parameters:
      - name: roleId
        in: path
        description: Role ID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Role deleted
    patch:
      tags:
      - admin
      operationId: update_role
      parameters:
      - name: roleId
        in: path
        description: Role ID
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSystemRoleRequest'
        required: true
      responses:
        '200':
          description: Updated role
  /v1/admin/roles/{roleId}/permissions:
    put:
      tags:
      - admin
      operationId: replace_role_permissions
      parameters:
      - name: roleId
        in: path
        description: Role ID
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplacePermissionsRequest'
        required: true
      responses:
        '200':
          description: Updated permissions
  /v1/admin/users:
    get:
      tags:
      - admin
      operationId: list_users
      responses:
        '200':
          description: User table
  /v1/admin/users/{userId}:
    get:
      tags:
      - admin
      operationId: get_user
      parameters:
      - name: userId
        in: path
        description: User ID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: User detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserDetailDto'
  /v1/admin/users/{userId}/activate:
    post:
      tags:
      - admin
      operationId: activate_user
      parameters:
      - name: userId
        in: path
        description: User ID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Activated user
  /v1/admin/users/{userId}/sessions/revoke:
    post:
      tags:
      - admin
      operationId: revoke_user_sessions
      parameters:
      - name: userId
        in: path
        description: User ID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Revoked session count
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevokedSessionsDto'
  /v1/admin/users/{userId}/suspend:
    post:
      tags:
      - admin
      operationId: suspend_user
      parameters:
      - name: userId
        in: path
        description: User ID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Suspended user
  /v1/admin/webhooks:
    get:
      tags:
      - admin
      operationId: list_webhooks
      responses:
        '200':
          description: Webhook table
  /v1/admin/webhooks/{webhookId}:
    get:
      tags:
      - admin
      operationId: get_webhook
      parameters:
      - name: webhookId
        in: path
        description: Webhook ID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Webhook detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookDetailDto'
  /v1/admin/webhooks/{webhookId}/deliveries:
    get:
      tags:
      - admin
      operationId: list_webhook_deliveries
      parameters:
      - name: webhookId
        in: path
        description: Webhook ID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Delivery attempts
  /v1/admin/webhooks/{webhookId}/deliveries/{deliveryId}:
    get:
      tags:
      - admin
      operationId: get_webhook_delivery
      parameters:
      - name: webhookId
        in: path
        description: Webhook ID
        required: true
        schema:
          type: string
          format: uuid
      - name: deliveryId
        in: path
        description: Delivery ID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Redacted delivery
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookDeliveryDto'
  /v1/auth/csrf:
    get:
      tags:
      - auth
      operationId: csrf
      responses:
        '200':
          description: CSRF token; also sets the readable CSRF cookie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfDto'
        '401':
          description: Not signed in
  /v1/auth/email/resend:
    post:
      tags:
      - auth
      operationId: resend_verification
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendVerificationRequest'
        required: true
      responses:
        '202':
          description: Verification email queued when applicable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusDto'
        '422':
          description: Email is required when signed out
  /v1/auth/email/verify:
    post:
      tags:
      - auth
      operationId: verify_email
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
        required: true
      responses:
        '200':
          description: Email verified; signs in the user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionDto'
        '410':
          description: Verification token is invalid or expired
  /v1/auth/login:
    post:
      tags:
      - auth
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Signed in; sets the session cookie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionDto'
        '401':
          description: Invalid credentials
        '403':
          description: Account suspended
        '429':
          description: Rate limited
  /v1/auth/logout:
    post:
      tags:
      - auth
      operationId: logout
      responses:
        '204':
          description: Signed out
  /v1/auth/oauth/google/callback:
    get:
      tags:
      - auth
      operationId: oauth_callback
      parameters:
      - name: code
        in: query
        required: false
        schema:
          type: string
      - name: state
        in: query
        required: false
        schema:
          type: string
      - name: error
        in: query
        required: false
        schema:
          type: string
      responses:
        '302':
          description: Redirect back to the app with a session cookie
        '503':
          description: Google sign-in is not configured in this environment
  /v1/auth/oauth/google/start:
    get:
      tags:
      - auth
      operationId: oauth_start
      parameters:
      - name: redirect
        in: query
        description: Relative path to return to
        required: false
        schema:
          type: string
      responses:
        '302':
          description: Redirect to Google consent
        '503':
          description: Google sign-in is not configured in this environment
  /v1/auth/password/change:
    post:
      tags:
      - auth
      operationId: change_password
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
        required: true
      responses:
        '204':
          description: Password changed; other sessions revoked
        '401':
          description: Not signed in
        '422':
          description: Validation failed or current password incorrect
  /v1/auth/password/forgot:
    post:
      tags:
      - auth
      operationId: forgot_password
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
        required: true
      responses:
        '202':
          description: Reset email queued when the account exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusDto'
        '429':
          description: Rate limited
  /v1/auth/password/reset:
    post:
      tags:
      - auth
      operationId: reset_password
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
        required: true
      responses:
        '204':
          description: Password reset; all sessions revoked
        '410':
          description: Reset token is invalid or expired
        '422':
          description: Validation failed
  /v1/auth/providers:
    get:
      tags:
      - auth
      operationId: providers
      responses:
        '200':
          description: Enabled sign-in providers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthProvidersDto'
  /v1/auth/register:
    post:
      tags:
      - auth
      operationId: register
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      responses:
        '202':
          description: Verification email queued (response is identical for existing accounts)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusDto'
        '422':
          description: Validation failed
        '429':
          description: Rate limited
  /v1/auth/session:
    get:
      tags:
      - auth
      operationId: session
      responses:
        '200':
          description: Current session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionDto'
        '401':
          description: Not signed in
  /v1/auth/session/refresh:
    post:
      tags:
      - auth
      operationId: refresh
      responses:
        '200':
          description: Rotated session; sets a new session cookie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionDto'
        '401':
          description: Not signed in
  /v1/auth/sessions:
    get:
      tags:
      - auth
      operationId: list_sessions
      responses:
        '200':
          description: Active sessions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionListDto'
        '401':
          description: Not signed in
    delete:
      tags:
      - auth
      operationId: revoke_others
      parameters:
      - name: keepCurrent
        in: query
        description: Keep the current session
        required: false
        schema:
          type: boolean
      responses:
        '204':
          description: Sessions revoked
        '401':
          description: Not signed in
  /v1/auth/sessions/{sessionId}:
    delete:
      tags:
      - auth
      operationId: revoke_session
      parameters:
      - name: sessionId
        in: path
        description: Session ID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Session revoked
        '404':
          description: Session not found
  /v1/events/{eventId}:
    get:
      tags:
      - events
      operationId: get_event
      parameters:
      - name: eventId
        in: path
        description: Event ID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Event profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventDto'
        '404':
          description: Event not found
    delete:
      tags:
      - events
      operationId: delete_event
      parameters:
      - name: eventId
        in: path
        description: Event ID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Draft event deleted
        '409':
          description: Only draft events can be deleted
    patch:
      tags:
      - events
      operationId: update_event
      parameters:
      - name: eventId
        in: path
        description: Event ID
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEventRequest'
        required: true
      responses:
        '200':
          description: Updated event
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventDto'
        '422':
          description: Validation or status transition failed
  /v1/events/{eventId}/assets:
    post:
      tags:
      - events
      operationId: event_assets
      parameters:
      - name: eventId
        in: path
        description: Event ID
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventAssetUploadRequest'
        required: true
      responses:
        '200':
          description: Presigned logo or cover upload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrandingUploadDto'
        '422':
          description: Unsupported file type or size
  /v1/events/{eventId}/certificates:
    get:
      tags:
      - documents
      operationId: list_certificates
      parameters:
      - name: eventId
        in: path
        description: Event ID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Paginated certificate rows
  /v1/events/{eventId}/certificates/generate:
    post:
      tags:
      - documents
      operationId: generate_certificates
      parameters:
      - name: eventId
        in: path
        description: Event ID
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDocumentJobRequest'
        required: true
      responses:
        '202':
          description: Certificate generation job accepted
  /v1/events/{eventId}/certificates/{certificateId}:
    get:
      tags:
      - documents
      operationId: get_certificate
      parameters:
      - name: eventId
        in: path
        description: Event ID
        required: true
        schema:
          type: string
          format: uuid
      - name: certificateId
        in: path
        description: Certificate ID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Certificate detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificateRowDto'
  /v1/events/{eventId}/certificates/{certificateId}/download:
    get:
      tags:
      - documents
      operationId: download_certificate
      parameters:
      - name: eventId
        in: path
        description: Event ID
        required: true
        schema:
          type: string
          format: uuid
      - name: certificateId
        in: path
        description: Certificate ID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Signed organizer copy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentDownloadDto'
        '409':
          description: Certificate file is not ready
  /v1/events/{eventId}/certificates/{certificateId}/revoke:
    post:
      tags:
      - documents
      operationId: revoke_certificate
      parameters:
      - name: eventId
        in: path
        description: Event ID
        required: true
        schema:
          type: string
          format: uuid
      - name: certificateId
        in: path
        description: Certificate ID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Revoked certificate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificateRowDto'
        '409':
          description: Only issued certificates can be revoked
  /v1/events/{eventId}/fonts:
    get:
      tags:
      - documents
      operationId: list_fonts
      parameters:
      - name: eventId
        in: path
        description: Event ID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Available fonts
